<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>cryp71c.dev</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side routing, so a direct load or refresh
      // of e.g. /blog/some-slug 404s. This re-encodes the real path into a
      // query string and redirects to the root, where the restore script in
      // index.html's <head> converts it back before React Router mounts.
      var pathSegmentsToKeep = 0; // deployed at the domain root (cryp71c.dev), not a /reponame/ subpath

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
