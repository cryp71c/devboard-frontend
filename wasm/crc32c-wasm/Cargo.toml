[package]
name = "crc32c-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser-runnable CRC32C demo for cryp71c.dev — the same portable algorithm from the mmfsr project's blog write-up, compiled to WebAssembly."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
